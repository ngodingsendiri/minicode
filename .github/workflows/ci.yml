name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: minicode

      # minicore = file:../minicore — DEPENDENSI. Harus ada sebagai sibling
      # folder minicode/ supaya `bun install` resolvable.
      - uses: actions/checkout@v4
        with:
          repository: ngodingsendiri/minicore
          path: minicore

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: minicode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('minicode/bun.lock', 'minicore/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: minicode
        run: bun install

      - name: Typecheck
        working-directory: minicode
        run: bun x tsc --noEmit

      - name: Lint (biome)
        working-directory: minicode
        run: bun run lint

      - name: Test with coverage (threshold 80)
        working-directory: minicode
        run: bun test --coverage

      - name: Test
        working-directory: minicode
        run: bun test

      - name: Test with docker sandbox (experimental)
        working-directory: minicode
        continue-on-error: true
        run: |
          MINICODE_SANDBOX=docker bun test

      - name: Benchmark smoke (fake provider)
        working-directory: minicode
        run: bun run bench:smoke

      - name: Telemetry gate (resolve rate target)
        working-directory: minicode
        run: bun run gate:telemetry

      - name: Typecheck minicore
        working-directory: minicore
        run: bun test
